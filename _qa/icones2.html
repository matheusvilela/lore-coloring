<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #f4f1ea; font: 13px ui-rounded, system-ui, sans-serif; color: #2a2622; padding: 16px 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell span { font-size: 11px; color: #8a8178; }
  .tool {
    display: grid; place-items: center; width: 56px; height: 56px; padding: 0; border: 0;
    border-radius: 18px; background: #fff; color: #4a443d;
    box-shadow: 0 3px 10px rgba(42,38,34,.12);
  }
  .tool.active { color: #d24545; box-shadow: inset 0 0 0 3px currentColor, 0 3px 10px rgba(42,38,34,.12); }
  .tool svg { width: 30px; height: 30px; }
  h2 { font-size: 12px; font-weight: 700; margin: 18px 0 10px; color: #6d655c; letter-spacing: .04em; text-transform: uppercase; }
  svg { display: block; }
</style>
</head>
<body style="width:560px">
