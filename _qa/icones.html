<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #f4f1ea; font: 13px ui-rounded, system-ui, sans-serif; color: #2a2622; padding: 18px 22px; }
  h2 { font-size: 13px; font-weight: 700; margin: 16px 0 8px; color: #6d655c; letter-spacing: .04em; text-transform: uppercase; }
  .row { display: flex; gap: 10px; align-items: center; }
  .tool {
    display: grid; place-items: center; width: 56px; height: 56px; padding: 0; border: 0;
    border-radius: 18px; background: #fff; color: #4a443d;
    box-shadow: 0 3px 10px rgba(42,38,34,.12);
  }
  .tool.active { color: #d24545; box-shadow: inset 0 0 0 3px currentColor, 0 3px 10px rgba(42,38,34,.12); }
  .small .tool { width: 44px; height: 44px; border-radius: 14px; }
  .small svg { width: 22px; height: 22px; }
  .caption { width: 100%; color: #8a8178; font-size: 12px; margin-top: 6px; }
  svg { display: block; }
</style>
</head>
