<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; background:#f4f1ea; font:12px ui-rounded, system-ui, sans-serif; color:#2a2622; padding:16px 20px; width:660px; }
  h2 { font-size:12px; font-weight:700; margin:14px 0 8px; color:#6d655c; letter-spacing:.04em; text-transform:uppercase; }
  .row { display:flex; gap:14px; align-items:flex-end; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .tool { display:grid; place-items:center; width:56px; height:56px; border:0; border-radius:18px; background:#fff; color:#4a443d; box-shadow:0 3px 10px rgba(42,38,34,.12); }
  .tool.s { width:44px; height:44px; border-radius:14px; }
  .tool svg { width:30px; height:30px; }
  .tool.s svg { width:23px; height:23px; }
  .tool.active { color:#d24545; box-shadow: inset 0 0 0 3px currentColor, 0 3px 10px rgba(42,38,34,.12); }
  svg { display:block; }
  .lbl { font-size:11px; color:#8a8178; }
</style>
</head>
